<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Lexend+Deca:wght@100..900&family=Orbitron:wght@400..900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="theme-glass">
    <div id="main_container">
        <h1>TIC-TAC-TOE</h1>
        
        <!-- Game Mode Selection -->
        <div id="mode-selection">
            <button id="btn-1p" class="mode-btn">1 Player (vs Computer)</button>
            <button id="btn-2p" class="mode-btn active">2 Players (Local)</button>
        </div>

        <!-- Bot Speech Bubble -->
        <div id="bot-dialogue" class="speech-bubble" style="display: none;">
            "Ready to test your skill?"
        </div>

        <div class="options-row">
            <!-- Theme Selection -->
            <div class="option-item">
                <label for="theme-select">Theme: </label>
                <select id="theme-select">
                    <option value="theme-glass" selected>Glassmorphism</option>
                    <option value="theme-cyberpunk">Cyberpunk Neon</option>
                    <option value="theme-arcade">Retro Arcade</option>
                    <option value="theme-minimal">Monochrome Minimal</option>
                </select>
            </div>

            <!-- Difficulty Selection -->
            <div id="difficulty-selection" class="option-item" style="display: none;">
                <label for="difficulty">Bot Difficulty: </label>
                <select id="difficulty">
                    <option value="0">Novice</option>
                    <option value="0.25">Apprentice</option>
                    <option value="0.5">Intermediate</option>
                    <option value="0.75">Advanced</option>
                    <option value="1" selected>Expert</option>
                </select>
            </div>

            <!-- Speed Mode Toggle -->
            <div id="speed-mode-toggle" class="option-item">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="speed-checkbox"> Speed Mode (5s)
                </label>
            </div>
        </div>

        <!-- Scoreboard -->
        <div id="scoreboard">
            <div class="score-box"><span id="score-X">0</span><br>Player X</div>
            <div class="score-box"><span id="score-ties">0</span><br>Ties</div>
            <div class="score-box"><span id="score-O">0</span><br>Player O</div>
        </div>

        <!-- Timer Display -->
        <div id="timer-display" style="display: none;">Time Left: <span id="time-left">5</span>s</div>

        <!-- Game Grid -->
        <div id="container">
            <div class="card" id="0"></div>
            <div class="card" id="1"></div>
            <div class="card" id="2"></div>
            <div class="card" id="3"></div>
            <div class="card" id="4"></div>
            <div class="card" id="5"></div>
            <div class="card" id="6"></div>
            <div class="card" id="7"></div>
            <div class="card" id="8"></div>
        </div>
        
        <!-- Controls -->
        <div class="action-buttons">
            <div id="restart">RESTART</div>
            <button id="hint-btn">💡 HINT</button>
        </div>
        <div id="announce"></div>
    </div>
    
    <script src="./TicTacToe.js"></script>
</body>
</html>
