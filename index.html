<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Lexend+Deca:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Rubik+Wet+Paint&family=Sixtyfour&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main_container">
        <h1>TIC-TAC-TOE</h1>
        
        <!-- Game Mode Selection -->
        <div id="mode-selection">
            <button id="btn-1p" class="mode-btn">1 Player (vs Computer)</button>
            <button id="btn-2p" class="mode-btn active">2 Players (Local)</button>
        </div>

        <!-- Difficulty Selection -->
        <div id="difficulty-selection" style="display: none; margin-bottom: 15px;">
            <label for="difficulty" style="font-size: 18px;">Bot Difficulty: </label>
            <select id="difficulty" style="padding: 5px; border-radius: 5px; font-family: 'Jua', serif; font-size: 16px; cursor: pointer;">
                <option value="0">Novice</option>
                <option value="0.25">Apprentice</option>
                <option value="0.5">Intermediate</option>
                <option value="0.75">Advanced</option>
                <option value="1" selected>Expert</option>
            </select>
        </div>

        <div id="container">
            <div class="card" id="0"></div>
            <div class="card" id="1"></div>
            <div class="card" id="2"></div>
            <div class="card" id="3"></div>
            <div class="card" id="4"></div>
            <div class="card" id="5"></div>
            <div class="card" id="6"></div>
            <div class="card" id="7"></div>
            <div class="card" id="8"></div>
        </div>
        
        <div id="restart">RESTART</div>
        <div id="announce"></div>
    </div>
    
    <script src="./TicTacToe.js"></script>
</body>
</html>
